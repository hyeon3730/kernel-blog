<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
{{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
<script>try{const t=localStorage.getItem('kernel-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch{}</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="{{ "js/site.js" | relURL }}"></script>
</head><body>
<a class="skip" href="#main">본문으로</a>{{ partial "header.html" . }}
<div class="site-layout"><div id="drawer-backdrop" class="drawer-backdrop" hidden></div>{{ partial "tree.html" . }}
<main id="main" class="shell" tabindex="-1">{{ block "main" . }}{{ end }}</main>
<footer class="shell site-footer">© {{ now.Format "2006" }} KERNEL, <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.ko" rel="license">CC BY-NC-ND 4.0</a>. 출처를 밝히고, 상업적으로 쓰지 않고, 고치지 않는 조건으로 나눌 수 있습니다.</footer></div>
{{ partial "popup.html" . }}{{ partial "ad.html" . }}
</body></html>
